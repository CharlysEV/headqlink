name: Android CI

# headqlink: también con cada cambio de la rama de trabajo (publico), no solo al publicar en main. Compila la versión
# de verdad (githubRelease, sin firmar: la clave no está en GitHub) y pasa todos los tests (app, protocolo y simulador).
on:
  pull_request:
  push:
    branches: [main, publico]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. a new push to an open PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only; this workflow needs no write scopes and touches no secrets,
# so it runs unchanged on pull requests opened from forks.
permissions:
  contents: read

jobs:
  check:
    name: Tests y versión publicada (github release, sin firmar)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # El nombre del APK y BuildConfig.GIT_SHA salen de git (rev-parse): hace falta el historial.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # NDK y CMake: las versiones fijadas en app/build.gradle.kts (ndkVersion). Con reintentos: sdkmanager a veces
      # baja un zip corrupto en los runners de GitHub ("Error on ZipFile unknown archive").
      - name: Install pinned NDK and CMake
        run: |
          NDK=$(sed -n 's/^ *ndkVersion *= *"\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "NDK $NDK"
          for attempt in 1 2 3; do
            sdkmanager "ndk;$NDK" "cmake;3.22.1" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # github flavor only: the playstore flavor cannot compile because
      # VpnControl.kt lives solely in app/src/github.
      - name: Tests (protocolo, simulador y app)
        run: ./gradlew :qdcore:test :qdsim:test :app:testGithubDebugUnitTest --stacktrace

      - name: Versión publicada (githubRelease, sin firmar)
        run: ./gradlew :app:assembleGithubRelease --stacktrace

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Qonecta+ · ${GITHUB_REF_NAME} · ${GITHUB_SHA::12}"
            for f in app/build/outputs/apk/github/release/*.apk; do
              [ -f "$f" ] && echo "- APK: $(basename "$f") · $(( $(stat -c%s "$f") / 1024 / 1024 )) MB (sin firmar)"
            done
            for d in app qdcore qdsim; do
              r=$(find "$d/build/test-results" -name 'TEST-*.xml' 2>/dev/null)
              [ -z "$r" ] && continue
              t=$(cat $r | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ | bc)
              f=$(cat $r | grep -o 'failures="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ | bc)
              echo "- Tests $d: $t (fallos: $f)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Informes de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testGithubDebugUnitTest
            app/build/test-results/testGithubDebugUnitTest
            qdcore/build/reports/tests
            qdsim/build/reports/tests
          if-no-files-found: warn
          retention-days: 14
